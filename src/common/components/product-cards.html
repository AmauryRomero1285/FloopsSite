<!-- ../../common/components/product-card.html -->
<div
  class="bg-white dark:bg-slate-800 rounded-2xl overflow-hidden border border-slate-100 dark:border-slate-700 hover:shadow-xl transition-all group flex flex-col h-full"
  data-product-id=""
  data-name=""
  data-price=""
  data-unit=""
  data-image=""
  data-discount=""
  data-category=""
  data-original-price=""
>
  <div class="relative overflow-hidden h-48 bg-slate-100 dark:bg-slate-700">
    <img
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
      alt=""
      src=""
    />

    <!-- Badge descuento -->
    <span class="discount-badge absolute top-3 left-3 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase shadow-sm hidden">
      -0%
    </span>

    <!-- Badge "Nuevo" (opcional) -->
    <span class="new-badge absolute top-3 left-3 bg-secondary text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase shadow-sm hidden">
      Nuevo
    </span>

    <!-- Favorito -->
    <button
      class="absolute top-3 right-3 p-2 bg-white/80 dark:bg-slate-900/80 backdrop-blur rounded-full text-slate-400 hover:text-red-500 transition-colors"
      title="Añadir a favoritos"
    >
      <span class="material-symbols-outlined text-lg">favorite_border</span>
    </button>
  </div>

  <div class="p-4 flex flex-col flex-1">
    <p class="category text-xs text-slate-400 font-medium mb-1"></p>
    <h3 class="name font-bold text-slate-800 dark:text-white mb-2 line-clamp-2 min-h-[2.75rem]"></h3>

    <div class="mt-auto">
      <div class="flex items-baseline gap-2 mb-3">
        <span class="price text-xl font-bold text-slate-900 dark:text-white"></span>
        <span class="original-price text-sm text-slate-400 line-through hidden"></span>
        <span class="unit text-[10px] text-slate-500 ml-auto"></span>
      </div>

      <button
        class="add-to-cart-btn w-full py-3 bg-primary dark:bg-slate-700 hover:bg-primary hover:text-white dark:hover:bg-primary transition-all rounded-xl font-bold text-sm flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined text-lg">add_shopping_cart</span>
        Añadir
      </button>
    </div>
  </div>
</div>
